<script>
  // ---------- Progress bar ----------
  window.addEventListener('scroll', () => {
    const h = document.documentElement;
    const pct = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
    document.getElementById('progressBar').style.width = pct + '%';
  });

  // ---------- Smart normalization ----------
  // Expands contractions and strips punctuation so "I'm not" == "I am not" etc.
  const CONTRACTIONS = [
    [/\bi'm\b/g, 'i am'],
    [/\byou're\b/g, 'you are'],
    [/\bwe're\b/g, 'we are'],
    [/\bthey're\b/g, 'they are'],
    [/\bhe's\b/g, 'he is'],
    [/\bshe's\b/g, 'she is'],
    [/\bit's\b/g, 'it is'],
    [/\bthat's\b/g, 'that is'],
    [/\bwhat's\b/g, 'what is'],
    [/\bwho's\b/g, 'who is'],
    [/\bwhere's\b/g, 'where is'],
    [/\bwhen's\b/g, 'when is'],
    [/\bwhy's\b/g, 'why is'],
    [/\bhow's\b/g, 'how is'],
    [/\bthere's\b/g, 'there is'],
    [/\bhere's\b/g, 'here is'],
    [/\blet's\b/g, 'let us'],
    [/\bisn't\b/g, 'is not'],
    [/\baren't\b/g, 'are not'],
    [/\bwasn't\b/g, 'was not'],
    [/\bweren't\b/g, 'were not'],
    [/\bdon't\b/g, 'do not'],
    [/\bdoesn't\b/g, 'does not'],
    [/\bdidn't\b/g, 'did not'],
    [/\bhaven't\b/g, 'have not'],
    [/\bhasn't\b/g, 'has not'],
    [/\bhadn't\b/g, 'had not'],
    [/\bcan't\b/g, 'can not'],
    [/\bcannot\b/g, 'can not'],
    [/\bwon't\b/g, 'will not'],
    [/\bwouldn't\b/g, 'would not'],
    [/\bshan't\b/g, 'shall not'],
    [/\bshouldn't\b/g, 'should not'],
    [/\bmustn't\b/g, 'must not'],
    [/\bneedn't\b/g, 'need not'],
    [/\b'd\b/g, ' would'],   // I'd → I would (rough)
    [/\b'll\b/g, ' will'],   // I'll → I will
    [/\b've\b/g, ' have'],   // I've → I have
    [/\b're\b/g, ' are'],    // we're → we are
  ];

  function normalize(str) {
    if (!str) return '';
    let s = str.toString().toLowerCase();
    // normalize curly apostrophes to straight
    s = s.replace(/[\u2018\u2019\u02BC]/g, "'");
    // apply contraction expansions
    CONTRACTIONS.forEach(([re, rep]) => { s = s.replace(re, rep); });
    // remove all punctuation except spaces and apostrophes (which we've mostly handled)
    s = s.replace(/[.,!?;:"()\[\]{}«»…]/g, ' ');
    s = s.replace(/'/g, '');   // remove any remaining apostrophes
    // collapse whitespace
    s = s.replace(/\s+/g, ' ').trim();
    return s;
  }

  // ---------- Check single exercise ----------
  function checkExercise(btn) {
    const exercise = btn.closest('.exercise');
    const inputs = exercise.querySelectorAll('.fill-input[data-answer]');
    const selects = exercise.querySelectorAll('.match-select[data-answer]');

    let correct = 0, total = 0;

    inputs.forEach(input => {
      total++;
      const userAns = normalize(input.value);
      const accepted = input.dataset.answer.split('|').map(a => normalize(a));
      const isCorrect = accepted.includes(userAns);
      if (isCorrect) {
        input.classList.add('correct');
        input.classList.remove('wrong');
        correct++;
      } else {
        input.classList.add('wrong');
        input.classList.remove('correct');
      }
    });

    selects.forEach(sel => {
      total++;
      const userAns = normalize(sel.value);
      const accepted = sel.dataset.answer.split('|').map(a => normalize(a));
      const isCorrect = accepted.includes(userAns);
      if (isCorrect) {
        sel.classList.add('correct');
        sel.classList.remove('wrong');
        correct++;
      } else {
        sel.classList.add('wrong');
        sel.classList.remove('correct');
      }
    });

    const feedback = exercise.querySelector('.feedback');
    feedback.classList.add('show');
    if (correct === total && total > 0) {
      feedback.classList.remove('bad');
      feedback.classList.add('good');
      feedback.textContent = `Perfect! ${correct}/${total} correct. ✓`;
    } else {
      feedback.classList.remove('good');
      feedback.classList.add('bad');
      feedback.textContent = `${correct}/${total} correct. Review the highlighted fields — red items need attention.`;
    }
  }

  // ---------- Show answers ----------
  function showAnswers(btn) {
    const exercise = btn.closest('.exercise');

    exercise.querySelectorAll('.fill-input[data-answer]').forEach(input => {
      const first = input.dataset.answer.split('|')[0];
      input.value = first;
      input.classList.add('correct');
      input.classList.remove('wrong');
      input.readOnly = true;
    });

    exercise.querySelectorAll('.match-select[data-answer]').forEach(sel => {
      sel.value = sel.dataset.answer.split('|')[0];
      sel.classList.add('correct');
      sel.classList.remove('wrong');
    });

    const feedback = exercise.querySelector('.feedback');
    feedback.classList.add('show', 'good');
    feedback.classList.remove('bad');
    feedback.textContent = 'Answers shown. Click Reset to try again from scratch.';
  }

  // ---------- Reset ----------
  function resetExercise(btn) {
    const exercise = btn.closest('.exercise');

    exercise.querySelectorAll('.fill-input[data-answer]').forEach(input => {
      if (!input.hasAttribute('data-locked')) {
        input.value = '';
        input.readOnly = false;
      } else {
        input.value = input.dataset.locked;
      }
      input.classList.remove('correct', 'wrong');
    });

    exercise.querySelectorAll('.match-select[data-answer]').forEach(sel => {
      sel.value = '';
      sel.classList.remove('correct', 'wrong');
    });

    const feedback = exercise.querySelector('.feedback');
    feedback.classList.remove('show', 'good', 'bad');
  }

  // ---------- Store initially-locked readonly inputs ----------
  // (So Reset restores them to their original displayed value, not blank.)
  document.querySelectorAll('.fill-input[readonly]').forEach(inp => {
    inp.dataset.locked = inp.value;
  });

  // ---------- Clear red styling when user edits a field ----------
  document.querySelectorAll('.fill-input, .match-select').forEach(el => {
    const evt = el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(evt, () => {
      el.classList.remove('correct', 'wrong');
    });
  });
</script>

</body>
</html>
