<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --ink: #1f2933;
    --muted: #5c6b7a;
    --accent: #1e6f5c;
    --accent-light: #e6f2ee;
    --accent-dark: #14503f;
    --highlight: #fff3cd;
    --correct: #2e7d32;
    --correct-bg: #e8f5e9;
    --correct-border: #a5d6a7;
    --wrong: #c62828;
    --wrong-bg: #ffebee;
    --wrong-border: #ef9a9a;
    --border: #e3ddd0;
    --shadow: 0 4px 20px rgba(31, 41, 51, 0.06);
    --radius: 14px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: 'Georgia', 'Charter', 'Cambria', serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    font-size: 17px;
  }

  .progress-wrap {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 3px;
    background: transparent; z-index: 200;
  }
  .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s; }

  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(247, 245, 240, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 0;
  }
  .topbar-inner {
    max-width: 900px; margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .brand {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700; font-size: 14px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent);
  }
  .nav-links { display: flex; gap: 20px; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 13px; }
  .nav-links a { color: var(--muted); text-decoration: none; font-weight: 500; transition: color 0.2s; }
  .nav-links a:hover { color: var(--accent); }

  .hero { max-width: 900px; margin: 0 auto; padding: 60px 24px 20px; }
  .unit-badge {
    display: inline-block; font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent);
    background: var(--accent-light); padding: 6px 14px;
    border-radius: 100px; margin-bottom: 20px;
  }
  h1 {
    font-size: clamp(32px, 5vw, 48px); line-height: 1.15;
    margin: 0 0 16px; letter-spacing: -0.02em; font-weight: 700;
  }
  h1 .sub {
    display: block; font-size: 0.5em; color: var(--muted);
    font-weight: 400; margin-top: 10px; font-style: italic;
  }
  .lede { font-size: 19px; color: var(--muted); max-width: 640px; margin: 0; }

  main { max-width: 900px; margin: 0 auto; padding: 20px 24px 80px; }
  section { margin: 48px 0; }

  h2 {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent);
    margin: 0 0 20px; display: flex; align-items: center; gap: 12px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  h3 { font-size: 22px; margin: 32px 0 12px; letter-spacing: -0.01em; }
  h4 { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 700; margin: 24px 0 8px; color: var(--ink); }
  p { margin: 0 0 14px; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px 32px;
    box-shadow: var(--shadow); margin: 20px 0;
  }
  .example-box {
    background: var(--accent-light); border-left: 4px solid var(--accent);
    padding: 18px 22px; border-radius: 0 var(--radius) var(--radius) 0;
    margin: 20px 0; font-size: 17px;
  }
  .example-box .label {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent);
    display: block; margin-bottom: 8px;
  }
  .highlight {
    background: linear-gradient(180deg, transparent 60%, var(--highlight) 60%);
    font-weight: 600; padding: 0 2px;
  }
  .wrong-note { color: var(--wrong); font-size: 14px; font-style: italic; }

  .conj-table, .summary-table {
    width: 100%; border-collapse: collapse; margin: 20px 0;
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 15px;
    background: var(--card); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow);
  }
  .conj-table th, .summary-table th {
    background: var(--accent); color: #fff; text-align: left;
    padding: 14px 20px; font-weight: 600; font-size: 13px;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .conj-table td, .summary-table td {
    padding: 14px 20px; border-bottom: 1px solid var(--border); vertical-align: top;
  }
  .conj-table tr:last-child td, .summary-table tr:last-child td { border-bottom: none; }
  .conj-table tr:nth-child(even) td, .summary-table tr:nth-child(even) td { background: #fafaf7; }
  .conj-table code {
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
    font-size: 14px; background: var(--accent-light); color: var(--accent-dark);
    padding: 2px 7px; border-radius: 5px; font-weight: 600;
  }
  .summary-table em { font-style: normal; color: var(--accent-dark); font-weight: 600; }

  .exercise {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px 32px;
    margin: 28px 0; box-shadow: var(--shadow);
  }
  .exercise-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .ex-number {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px; font-weight: 700; background: var(--accent);
    color: #fff; padding: 4px 10px; border-radius: 6px; letter-spacing: 0.05em;
  }
  .ex-title {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 600; font-size: 15px; color: var(--ink); margin: 0;
  }
  .ex-instruction { color: var(--muted); font-size: 15px; margin: 4px 0 20px; }

  .verb-bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 20px; }
  .verb-chip {
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
    font-size: 14px; background: var(--highlight); color: #7a5c00;
    padding: 5px 12px; border-radius: 100px; font-weight: 600;
  }

  ol.ex-list { list-style: none; counter-reset: item; padding: 0; margin: 0; }
  ol.ex-list > li {
    counter-increment: item; padding: 14px 0 14px 42px;
    position: relative; border-bottom: 1px dashed var(--border); font-size: 16px;
  }
  ol.ex-list > li:last-child { border-bottom: none; }
  ol.ex-list > li::before {
    content: counter(item); position: absolute; left: 0; top: 14px;
    width: 28px; height: 28px; background: var(--accent-light);
    color: var(--accent-dark); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px; font-weight: 700;
  }

  /* Picture exercise */
  .pic-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px; margin: 20px 0;
  }
  .pic-card {
    background: #fafaf7; border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; text-align: center;
  }
  .pic-num {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700; color: var(--accent); font-size: 14px;
    display: block; margin-bottom: 8px;
  }
  .pic-emoji { font-size: 40px; display: block; margin: 8px 0; }
  .pic-text { font-size: 15px; color: var(--muted); }

  /* Matching dropdowns */
  .match-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; margin: 20px 0;
  }
  .match-col { padding: 16px 20px; }
  .match-col:first-child { border-right: 1px solid var(--border); }
  .match-row {
    padding: 10px 0; font-size: 15px; display: flex; gap: 10px;
    align-items: center; border-bottom: 1px dashed var(--border);
    min-height: 48px;
  }
  .match-row:last-child { border-bottom: none; }
  .match-num, .match-letter {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700; color: var(--accent);
    min-width: 18px; font-size: 14px;
  }
  .match-select {
    margin-left: auto;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px; font-weight: 600;
    padding: 6px 10px; border: 2px solid var(--border);
    border-radius: 8px; background: #fff; color: var(--ink);
    cursor: pointer; outline: none;
    transition: border-color 0.2s, background 0.2s;
    min-width: 70px;
  }
  .match-select:focus { border-color: var(--accent); }
  .match-select.correct { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); }
  .match-select.wrong { border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); }

  /* Inputs */
  .fill-input {
    font-family: inherit; font-size: 16px;
    border: none; border-bottom: 2px solid var(--accent);
    background: transparent; padding: 2px 6px;
    min-width: 140px; color: var(--accent-dark);
    font-weight: 600; outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .fill-input:focus {
    border-bottom-color: var(--accent-dark);
    background: #f0f7f4;
  }
  .fill-input.correct {
    border-bottom-color: var(--correct);
    color: var(--correct);
    background: var(--correct-bg);
  }
  .fill-input.wrong {
    border-bottom-color: var(--wrong);
    color: var(--wrong);
    background: var(--wrong-bg);
  }
  .fill-input[readonly] {
    color: var(--accent-dark);
    border-bottom-color: var(--accent-light);
    cursor: default;
  }
  .fill-input[readonly].correct {
    color: var(--correct);
    border-bottom-color: var(--correct);
    background: var(--correct-bg);
  }

  .btn-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .check-btn {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px; font-weight: 600; letter-spacing: 0.05em;
    background: var(--accent); color: #fff; border: none;
    padding: 10px 22px; border-radius: 8px; cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .check-btn:hover { background: var(--accent-dark); }
  .check-btn:active { transform: scale(0.97); }
  .show-btn {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px; font-weight: 600;
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); padding: 10px 22px;
    border-radius: 8px; cursor: pointer; transition: all 0.2s;
  }
  .show-btn:hover { background: var(--accent-light); }
  .reset-btn {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px; font-weight: 600;
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); padding: 10px 22px;
    border-radius: 8px; cursor: pointer; transition: all 0.2s;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  .feedback {
    margin-top: 16px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px; font-weight: 600;
    padding: 12px 18px; border-radius: 10px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.good { background: var(--correct-bg); color: var(--correct); border: 1px solid var(--correct-border); }
  .feedback.bad { background: var(--wrong-bg); color: var(--wrong); border: 1px solid var(--wrong-border); }

  .reveal {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; margin: 14px 0; overflow: hidden;
  }
  .reveal summary {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px; font-weight: 600; padding: 14px 20px;
    cursor: pointer; color: var(--accent); list-style: none;
    display: flex; align-items: center; justify-content: space-between;
    transition: background 0.2s; user-select: none;
  }
  .reveal summary:hover { background: #fafaf7; }
  .reveal summary::-webkit-details-marker { display: none; }
  .reveal summary::after {
    content: "+"; font-size: 20px; font-weight: 400;
    color: var(--muted); transition: transform 0.2s;
  }
  .reveal[open] summary::after { transform: rotate(45deg); }
  .reveal-content {
    padding: 16px 20px 20px; font-size: 15px;
    border-top: 1px solid var(--border);
  }
  .reveal-content ol { margin: 0; padding-left: 22px; }
  .reveal-content li { padding: 4px 0; color: var(--muted); }
  .reveal-content li strong { color: var(--accent-dark); }

  .objectives {
    list-style: none; padding: 0; margin: 20px 0;
    display: grid; gap: 10px;
  }
  .objectives li { padding-left: 32px; position: relative; font-size: 16px; }
  .objectives li::before {
    content: "✓"; position: absolute; left: 0; top: 0;
    color: var(--accent); font-weight: 700; font-size: 16px;
  }

  footer {
    max-width: 900px; margin: 0 auto;
    padding: 40px 24px 60px; border-top: 1px solid var(--border);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px; color: var(--muted); text-align: center;
  }
  footer .next-unit {
    display: inline-block; margin-top: 16px;
    background: var(--accent); color: #fff;
    padding: 12px 28px; border-radius: 100px;
    text-decoration: none; font-weight: 600; font-size: 14px;
    letter-spacing: 0.03em; transition: background 0.2s;
  }
  footer .next-unit:hover { background: var(--accent-dark); }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    .card, .exercise { padding: 22px 20px; }
    .match-grid { grid-template-columns: 1fr; }
    .match-col:first-child { border-right: none; border-bottom: 1px solid var(--border); }
    .nav-links { display: none; }
    .match-select { min-width: 60px; }
  }

  /* ---- project additions (real figures + prev/next nav) ---- */
  .pic-img {
    display: block; width: 100%; height: auto;
    border-radius: 8px; margin: 8px 0 12px;
    background: #fff;
  }
  .theory-fig {
    max-width: 320px; width: 100%;
    margin: 16px auto 4px;
  }
  a.pic-card { text-decoration: none; color: inherit; }
  a.pic-card:hover { border-color: var(--accent); background: var(--accent-light); }
  .chapter-list { list-style: none; padding: 0; margin: 18px 0 8px; }
  .chapter-list li { border-bottom: 1px solid var(--border); }
  .chapter-list li:first-child { border-top: 1px solid var(--border); }
  .chapter-list a {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 16px; padding: 13px 4px; text-decoration: none; color: var(--ink);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px; font-weight: 600; transition: color 0.2s;
  }
  .chapter-list a:hover { color: var(--accent); }
  .chapter-list .range { color: var(--muted); font-weight: 500; font-size: 13px; }
  .footer-nav {
    display: flex; gap: 12px; justify-content: center;
    flex-wrap: wrap; margin-top: 16px;
  }
  .footer-nav .next-unit { margin-top: 0; }
  footer .next-unit.prev {
    background: transparent; color: var(--accent);
    border: 1px solid var(--accent); padding: 11px 26px;
  }
  footer .next-unit.prev:hover { background: var(--accent-light); }
</style>
</head>
<body>

<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">English Grammar in Use</div>
    <nav class="nav-links">
      <a href="#theory">Theory</a>
      <a href="#exercises">Exercises</a>
      <a href="#answers">Answers</a>
      <a href="#summary">Summary</a>
    </nav>
  </div>
</div>
