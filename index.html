<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <title>Sankalp CGL Prep</title>
    <!-- Google Fonts: Space Grotesk, Hanken Grotesk & JetBrains Mono for Minimalist Mental Math Cockpit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('cgl_app_theme');
          if (theme === 'sage') {
            document.documentElement.setAttribute('data-theme', 'sage');
            document.documentElement.classList.add('sage');
          } else {
            if (theme === 'dark') {
              localStorage.setItem('cgl_app_theme', 'light');
            }
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark', 'sage');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
