<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <title>Sankalp CGL Prep</title>
    <!-- PWA & Mobile App Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sankalp CGL" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <!-- Google Fonts: Space Grotesk, Hanken Grotesk & JetBrains Mono for Minimalist Mental Math Cockpit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        // Early safeguard against browser storage-policy, extension message-channel, and write-stream rejections
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.name || String(reason))) || '';
          if (
            msg.indexOf('Access to storage is not allowed') !== -1 ||
            msg.indexOf('signal is aborted without reason') !== -1 ||
            msg.indexOf('message channel closed') !== -1 ||
            msg.indexOf('asynchronous response by returning true') !== -1 ||
            msg.indexOf('Write stream exhausted') !== -1 ||
            msg.indexOf('resource-exhausted') !== -1 ||
            (reason && reason.name === 'AbortError')
          ) {
            event.preventDefault();
            console.warn('[EarlySafeguard] Handled browser/extension notice:', msg);
          }
        });

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || String(event))) || '';
          if (
            msg.indexOf('Access to storage is not allowed') !== -1 ||
            msg.indexOf('message channel closed') !== -1 ||
            msg.indexOf('asynchronous response by returning true') !== -1 ||
            msg.indexOf('Write stream exhausted') !== -1 ||
            msg.indexOf('resource-exhausted') !== -1
          ) {
            event.preventDefault();
            console.warn('[EarlySafeguard] Handled window error notice:', msg);
          }
        });

        try {
          var theme = localStorage.getItem('cgl_app_theme');
          if (theme === 'sage') {
            document.documentElement.setAttribute('data-theme', 'sage');
            document.documentElement.classList.add('sage');
          } else {
            if (theme === 'dark') {
              localStorage.setItem('cgl_app_theme', 'light');
            }
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark', 'sage');
          }
        } catch (e) {}

        // Service Worker for PWA (Production only — disabled on localhost to prevent Vite dev cache bloat)
        if ('serviceWorker' in navigator) {
          var isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          if (isLocalhost) {
            // Clean up any stale service workers and dev caches on localhost
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                for (var j = 0; j < keys.length; j++) {
                  caches.delete(keys[j]);
                }
              });
            }
          } else if (window.location.protocol.startsWith('http')) {
            window.addEventListener('load', function() {
              try {
                navigator.serviceWorker.register('/sw.js').then(function(reg) {
                  console.log('[PWA] Service Worker registered with scope:', reg.scope);
                }).catch(function(err) {
                  console.warn('[PWA] Service Worker registration unavailable in this context:', err && err.message);
                });
              } catch (e) {
                console.warn('[PWA] Service Worker registration not supported:', e);
              }
            });
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
